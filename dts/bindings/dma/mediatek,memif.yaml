# Common fields for Intel ADSP HDA DMA controllers

description: Mediatek Memif controller

compatible: "mediatek,memif"

include: dma-controller.yaml

properties:
  reg:
    required: true

#  dma-channels:
#    required: true

  "#dma-cells":
    const: 1

  "dma-buf-addr-alignment":
    required: true

  "dma-buf-size-alignment":
    required: true

  "dma-copy-alignment":
    required: true

  fs2reg:
    type: array
    description: |
      Array of pairs <fs reg_val ...> used to convert sampling frequency
      to a register value.
    required: true

dma-cells:
  - channel

child-binding:
  description: Mediatek Audio Front End Memory Interface
  include:
    - name: base.yaml
      property-allowlist:
        - reg
        - status
  properties:
    reg:
      required: true
    dai-id:
      type: int
      required: true
      description: Host-defined SOF DAI index.  Must match the Linux kernel driver.
    afe-name:
      type: string
      required: true
    downlink:
      type: boolean
      description: True/present for downlink (capture) channels

    # These three are two-register arrays defining the DSP registers
    # that store the hi and low words of a 64 bit bus/host address.
    #
    base:
      type: array
    end:
      type: array
    cur:
      type: array

    # The remaining registers below are three-cell arrays describing a
    # bit field as <addr lshift width>.  Most of them are defaultable by
    # the driver and can be eliminated from DTS for hardware that does
    # not support the feature.  See the driver source for details.
    #
    enable:
      type: array
      description: Channel enable flag
    agent-disable:
      type: array
      description: Channel disable flag
    fs:
      type: array
      description: Sample rate register
    hd:
      type: array
      description: Sample format register
    ch-num:
      type: array
      description: Channel count register
    mono:
      type: array
      description: Mono flag register
    mono-invert:
      type: boolean
      description: Sense/meaning of mono flag
    quad-ch:
      type: array
      description: Quad channel flag register
    int-odd:
      type: array
    msb:
      type: array
    msb2:
      type: array
